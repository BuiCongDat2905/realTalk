version: '3.8'
services:
    mysql:
      image: mysql:8.0
      container_name: realTalk
      restart: unless-stopped
      environment:
        MYSQL_ROOT_PASSWORD: 123456
        MYSQL_DATABASE: realTalk-db
        MYSQL_USER: appuser
        MYSQL_PASSWORD: app123
    backend:
      environment:
        DB_HOST: mysql
        DB_PORT: 3307
        DB_NAME: realTalk_db
        DB_USERNAME: appuser
        DB_PASSWORD: app123
      ports:
        - '3307:3306'
      volumes:
        - mysql-data:/var/lib/mysql
      command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      healthcheck:
        test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456" ]
        interval: 10s
        timeout: 5s
        retries: 10

